<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日和日記 - フル機能＆ZIP移行対応版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip for ZIP file decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- React & Babel for browser execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#e8d5cf',
                            300: '#d1b2a7',
                            400: '#b88c7d',
                            500: '#a36d5c',
                            600: '#8c5343',
                            700: '#734032',
                            800: '#5e3428',
                            900: '#4e2d24',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        rounded: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #faf7f5;
            color: #332d2b;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1b2a7;
            border-radius: 9999px;
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full flex flex-col antialiased selection:bg-amber-200 selection:text-amber-900">

    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const MOODS = [
            { id: 'very_happy', label: '最高', emoji: '😆', color: 'text-amber-600 bg-amber-50 border-amber-200' },
            { id: 'happy', label: '良い', emoji: '😊', color: 'text-emerald-600 bg-emerald-50 border-emerald-200' },
            { id: 'neutral', label: 'ふつう', emoji: '😐', color: 'text-blue-600 bg-blue-50 border-blue-200' },
            { id: 'sad', label: 'しょんぼり', emoji: '😢', color: 'text-indigo-600 bg-indigo-50 border-indigo-200' },
            { id: 'tired', label: 'つかれた', emoji: '😫', color: 'text-rose-600 bg-rose-50 border-rose-200' },
        ];

        const WEATHERS = [
            { id: 'sunny', label: '晴れ', icon: '☀️' },
            { id: 'cloudy', label: 'くもり', icon: '☁️' },
            { id: 'rainy', label: '雨', icon: '🌧️' },
            { id: 'snowy', label: '雪', icon: '❄️' },
        ];

        const INITIAL_ENTRIES = [
            {
                id: 'demo-1',
                date: new Date().toISOString().split('T')[0],
                title: '新しい日和日記へようこそ！',
                content: '写真の添付、天気や気分の記録、カレンダーでの振り返り、Diaries.zipからの一括取り込みに完全対応した日記アプリです。',
                mood: 'very_happy',
                weather: 'sunny',
                tags: ['日記', 'スタート'],
                isFavorite: true,
                image: null,
                createdAt: new Date().toISOString()
            }
        ];

        // 日付フォーマットヘルパー
        const formatDateStr = (date) => {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getJapaneseDateStr = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const date = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
            const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
            return `${y}年${parseInt(m)}月${parseInt(d)}日 (${weekDays[date.getDay()]})`;
        };

        const extractDateFromText = (str) => {
            if (!str) return null;
            const match = str.match(/(20\d{2}|19\d{2})[\/\.\-_年]\s*(\d{1,2})[\/\.\-_月]\s*(\d{1,2})/);
            if (match) {
                const y = match[1];
                const m = String(parseInt(match[2])).padStart(2, '0');
                const d = String(parseInt(match[3])).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            return null;
        };

        function App() {
            const [entries, setEntries] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('hiyori_diary_data_full');
                    return saved ? JSON.parse(saved) : INITIAL_ENTRIES;
                } catch (e) {
                    return INITIAL_ENTRIES;
                }
            });

            const [currentTab, setCurrentTab] = React.useState('timeline');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [filterMood, setFilterMood] = React.useState('all');
            const [filterTag, setFilterTag] = React.useState('all');
            const [onlyFavorites, setOnlyFavorites] = React.useState(false);

            // カレンダー用
            const [calendarDate, setCalendarDate] = React.useState(new Date());
            const [selectedCalendarDate, setSelectedCalendarDate] = React.useState(formatDateStr(new Date()));

            // エディタモーダル用
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [editingId, setEditingId] = React.useState(null);
            const [formDate, setFormDate] = React.useState(formatDateStr(new Date()));
            const [formTitle, setFormTitle] = React.useState('');
            const [formContent, setFormContent] = React.useState('');
            const [formMood, setFormMood] = React.useState('happy');
            const [formWeather, setFormWeather] = React.useState('sunny');
            const [formTags, setFormTags] = React.useState('');
            const [formImage, setFormImage] = React.useState(null);

            // ZIPインポート用
            const [pendingImports, setPendingImports] = React.useState([]);
            const [importConflictMode, setImportConflictMode] = React.useState('overwrite');
            const [isImporting, setIsImporting] = React.useState(false);
            const [toast, setToast] = React.useState(null);

            // LocalStorage同期
            React.useEffect(() => {
                try {
                    localStorage.setItem('hiyori_diary_data_full', JSON.stringify(entries));
                } catch (e) {
                    console.error(e);
                }
            }, [entries]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3200);
            };

            // 全タグ取得
            const allTags = React.useMemo(() => {
                const set = new Set();
                entries.forEach(e => {
                    if (Array.isArray(e.tags)) e.tags.forEach(t => t && set.add(t));
                });
                return Array.from(set);
            }, [entries]);

            // フィルタ済みリスト
            const filteredEntries = React.useMemo(() => {
                return entries.filter(item => {
                    const q = searchQuery.toLowerCase();
                    const matchSearch = !q || 
                        item.title.toLowerCase().includes(q) ||
                        item.content.toLowerCase().includes(q) ||
                        (item.tags && item.tags.some(t => t.toLowerCase().includes(q)));
                    
                    const matchMood = filterMood === 'all' || item.mood === filterMood;
                    const matchTag = filterTag === 'all' || (item.tags && item.tags.includes(filterTag));
                    const matchFav = !onlyFavorites || item.isFavorite;

                    return matchSearch && matchMood && matchTag && matchFav;
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [entries, searchQuery, filterMood, filterTag, onlyFavorites]);

            // 統計計算
            const stats = React.useMemo(() => {
                const totalCount = entries.length;
                const totalWords = entries.reduce((acc, cur) => acc + (cur.content ? cur.content.length : 0), 0);
                const avgWords = totalCount > 0 ? Math.round(totalWords / totalCount) : 0;
                
                const moodCounts = {};
                MOODS.forEach(m => moodCounts[m.id] = 0);
                entries.forEach(e => {
                    if (moodCounts[e.mood] !== undefined) moodCounts[e.mood]++;
                });

                return { totalCount, totalWords, avgWords, moodCounts };
            }, [entries]);

            const openNewEditor = (targetDate = null) => {
                setEditingId(null);
                setFormDate(targetDate || formatDateStr(new Date()));
                setFormTitle('');
                setFormContent('');
                setFormMood('happy');
                setFormWeather('sunny');
                setFormTags('');
                setFormImage(null);
                setIsModalOpen(true);
            };

            const openEditEditor = (entry) => {
                setEditingId(entry.id);
                setFormDate(entry.date);
                setFormTitle(entry.title);
                setFormContent(entry.content);
                setFormMood(entry.mood || 'happy');
                setFormWeather(entry.weather || 'sunny');
                setFormTags(entry.tags ? entry.tags.join(', ') : '');
                setFormImage(entry.image || null);
                setIsModalOpen(true);
            };

            const handleSaveEntry = (e) => {
                e.preventDefault();
                if (!formContent.trim() && !formTitle.trim()) {
                    showToast('タイトルまたは本文を入力してください', 'error');
                    return;
                }

                const tagArray = formTags
                    .split(/[,、\s]+/)
                    .map(t => t.trim())
                    .filter(t => t.length > 0);

                const titleToSave = formTitle.trim() || formContent.slice(0, 20).replace(/\n/g, ' ') || '無題の日記';

                if (editingId) {
                    setEntries(prev => prev.map(item => item.id === editingId ? {
                        ...item,
                        date: formDate,
                        title: titleToSave,
                        content: formContent,
                        mood: formMood,
                        weather: formWeather,
                        tags: tagArray,
                        image: formImage,
                        updatedAt: new Date().toISOString()
                    } : item));
                    showToast('✏️ 日記を更新しました', 'success');
                } else {
                    const newEntry = {
                        id: `entry-${Date.now()}`,
                        date: formDate,
                        title: titleToSave,
                        content: formContent,
                        mood: formMood,
                        weather: formWeather,
                        tags: tagArray,
                        image: formImage,
                        isFavorite: false,
                        createdAt: new Date().toISOString()
                    };
                    setEntries(prev => [newEntry, ...prev]);
                    showToast('✨ 新しい日記を保存しました', 'success');
                }
                setIsModalOpen(false);
            };

            const handleDeleteEntry = (id) => {
                setEntries(prev => prev.filter(e => e.id !== id));
                showToast('🗑️ 削除しました', 'info');
            };

            const toggleFavorite = (id) => {
                setEntries(prev => prev.map(e => e.id === id ? { ...e, isFavorite: !e.isFavorite } : e));
            };

            const handleImageUpload = (file) => {
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    showToast('画像サイズは5MB以下にしてください', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => setFormImage(e.target.result);
                reader.readAsDataURL(file);
            };

            const processZipFile = async (file) => {
                if (!file || !file.name.toLowerCase().endsWith('.zip')) {
                    showToast('ZIPファイルを選択してください', 'error');
                    return;
                }

                setIsImporting(true);
                try {
                    const zip = await JSZip.loadAsync(file);
                    const extracted = [];

                    for (let relativePath in zip.files) {
                        const zipEntry = zip.files[relativePath];
                        if (zipEntry.dir) continue;

                        if (relativePath.toLowerCase().endsWith('.txt')) {
                            const content = await zipEntry.async('text');
                            const trimmed = content.trim();

                            const dateFromPath = extractDateFromText(relativePath);
                            const dateFromContent = extractDateFromText(trimmed);
                            const finalDate = dateFromPath || dateFromContent || formatDateStr(new Date());

                            let title = '無題の日記';
                            if (trimmed) {
                                const firstLine = trimmed.split(/\r?\n/)[0].trim();
                                if (firstLine.length > 0 && firstLine.length <= 25) {
                                    title = firstLine;
                                } else {
                                    title = trimmed.slice(0, 20).replace(/\n/g, ' ') + '...';
                                }
                            }

                            extracted.push({
                                id: `zip-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`,
                                date: finalDate,
                                title: title,
                                content: trimmed || '（本文なし）',
                                mood: 'happy',
                                weather: 'sunny',
                                tags: ['Diaries移行'],
                                isFavorite: false,
                                createdAt: new Date(finalDate).toISOString()
                            });
                        }
                    }

                    setIsImporting(false);

                    if (extracted.length > 0) {
                        extracted.sort((a, b) => new Date(b.date) - new Date(a.date));
                        setPendingImports(extracted);
                        showToast(`🎉 ${extracted.length}件の日記データを検出しました！`, 'success');
                    } else {
                        showToast('ZIP内に有効なTXT日記データが見つかりませんでした', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    setIsImporting(false);
                    showToast('ZIPファイルの解析に失敗しました', 'error');
                }
            };

            const executeImport = () => {
                if (pendingImports.length === 0) return;

                let updatedList = [...entries];
                let added = 0, overwritten = 0;

                pendingImports.forEach(imp => {
                    const idx = updatedList.findIndex(e => e.date === imp.date);
                    if (idx >= 0) {
                        if (importConflictMode === 'overwrite') {
                            updatedList[idx] = { ...imp, id: updatedList[idx].id };
                            overwritten++;
                        } else if (importConflictMode === 'keepBoth') {
                            updatedList.push(imp);
                            added++;
                        }
                    } else {
                        updatedList.push(imp);
                        added++;
                    }
                });

                updatedList.sort((a, b) => new Date(b.date) - new Date(a.date));
                setEntries(updatedList);
                setPendingImports([]);
                showToast(`✨ インポート完了: ${added}件追加、${overwritten}件上書き`, 'success');
                setCurrentTab('timeline');
            };

            // バックアップデータ出力
            const exportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
                const anchor = document.createElement('a');
                anchor.setAttribute("href", dataStr);
                anchor.setAttribute("download", `hiyori_diary_backup_${formatDateStr(new Date())}.json`);
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                showToast('💾 バックアップを出力しました', 'success');
            };

            return (
                <div className="h-full flex flex-col">
                    {/* トースト通知 */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold text-white flex items-center gap-2 animate-fade-in ${
                            toast.type === 'success' ? 'bg-emerald-600' : toast.type === 'error' ? 'bg-rose-600' : 'bg-stone-800'
                        }`}>
                            <i className="fa-solid fa-circle-info"></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* ヘッダー */}
                    <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
                        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentTab('timeline')}>
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                                    <i className="fa-solid fa-book-open text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold font-rounded text-stone-800 tracking-tight leading-none">日和日記</h1>
                                    <span className="text-[10px] text-brand-600 font-semibold tracking-wider uppercase">フル機能＆ZIP移行対応</span>
                                </div>
                            </div>

                            {/* Nav Buttons (Desktop) */}
                            <nav className="hidden md:flex items-center gap-1 bg-stone-100 p-1 rounded-2xl border border-stone-200/60">
                                <button onClick={() => setCurrentTab('timeline')} className={`px-4 py-1.5 rounded-xl text-xs font-medium transition-all ${currentTab === 'timeline' ? 'bg-white shadow-sm text-brand-700 font-bold' : 'text-stone-600'}`}>
                                    <i className="fa-solid fa-list-ul mr-1"></i> タイムライン
                                </button>
                                <button onClick={() => setCurrentTab('calendar')} className={`px-4 py-1.5 rounded-xl text-xs font-medium transition-all ${currentTab === 'calendar' ? 'bg-white shadow-sm text-brand-700 font-bold' : 'text-stone-600'}`}>
                                    <i className="fa-regular fa-calendar-days mr-1"></i> カレンダー
                                </button>
                                <button onClick={() => setCurrentTab('analytics')} className={`px-4 py-1.5 rounded-xl text-xs font-medium transition-all ${currentTab === 'analytics' ? 'bg-white shadow-sm text-brand-700 font-bold' : 'text-stone-600'}`}>
                                    <i className="fa-solid fa-chart-pie mr-1"></i> 振り返り
                                </button>
                                <button onClick={() => setCurrentTab('import')} className={`px-4 py-1.5 rounded-xl text-xs font-medium transition-all ${currentTab === 'import' ? 'bg-white shadow-sm text-amber-600 font-bold' : 'text-stone-600'}`}>
                                    <i className="fa-solid fa-file-zipper mr-1 text-amber-500"></i> ZIP一括移行
                                </button>
                            </nav>

                            <button onClick={() => openNewEditor()} className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-md shadow-brand-600/30 flex items-center gap-2 transition active:scale-95">
                                <i className="fa-solid fa-pen-nib"></i>
                                <span>日記を書く</span>
                            </button>
                        </div>
                    </header>

                    {/* Mobile Bottom Navigation */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-stone-200 px-3 py-2 flex justify-around items-center">
                        <button onClick={() => setCurrentTab('timeline')} className={`flex flex-col items-center gap-1 text-xs ${currentTab === 'timeline' ? 'text-brand-600 font-bold' : 'text-stone-400'}`}>
                            <i className="fa-solid fa-list-ul text-base"></i>
                            <span>一覧</span>
                        </button>
                        <button onClick={() => setCurrentTab('calendar')} className={`flex flex-col items-center gap-1 text-xs ${currentTab === 'calendar' ? 'text-brand-600 font-bold' : 'text-stone-400'}`}>
                            <i className="fa-regular fa-calendar-days text-base"></i>
                            <span>カレンダー</span>
                        </button>
                        <button onClick={() => openNewEditor()} className="w-12 h-12 -mt-5 rounded-full bg-brand-600 text-white flex items-center justify-center text-xl shadow-lg shadow-brand-600/40 active:scale-90 transition">
                            <i className="fa-solid fa-plus"></i>
                        </button>
                        <button onClick={() => setCurrentTab('analytics')} className={`flex flex-col items-center gap-1 text-xs ${currentTab === 'analytics' ? 'text-brand-600 font-bold' : 'text-stone-400'}`}>
                            <i className="fa-solid fa-chart-pie text-base"></i>
                            <span>統計</span>
                        </button>
                        <button onClick={() => setCurrentTab('import')} className={`flex flex-col items-center gap-1 text-xs ${currentTab === 'import' ? 'text-amber-600 font-bold' : 'text-stone-400'}`}>
                            <i className="fa-solid fa-file-zipper text-base text-amber-500"></i>
                            <span>ZIP移行</span>
                        </button>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6 pb-24 md:pb-12 overflow-y-auto">

                        {/* ================= 1. TIMELINE VIEW ================= */}
                        {currentTab === 'timeline' && (
                            <div className="space-y-4 animate-fade-in">
                                {/* Search & Filters */}
                                <div className="bg-white p-4 rounded-3xl border border-stone-200 shadow-xs space-y-3">
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <div className="relative flex-1">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-xs"></i>
                                            <input
                                                type="text"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                placeholder="キーワードやタグで検索..."
                                                className="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-2xl text-xs focus:outline-none focus:border-brand-500"
                                            />
                                        </div>

                                        <div className="flex items-center gap-2 overflow-x-auto">
                                            <select value={filterMood} onChange={(e) => setFilterMood(e.target.value)} className="px-3 py-2 bg-stone-50 border border-stone-200 rounded-2xl text-xs font-medium text-stone-700">
                                                <option value="all">😊 すべての気分</option>
                                                {MOODS.map(m => <option key={m.id} value={m.id}>{m.emoji} {m.label}</option>)}
                                            </select>

                                            <select value={filterTag} onChange={(e) => setFilterTag(e.target.value)} className="px-3 py-2 bg-stone-50 border border-stone-200 rounded-2xl text-xs font-medium text-stone-700">
                                                <option value="all">🏷️ すべてのタグ</option>
                                                {allTags.map(t => <option key={t} value={t}>#{t}</option>)}
                                            </select>

                                            <button
                                                onClick={() => setOnlyFavorites(!onlyFavorites)}
                                                className={`px-3 py-2 rounded-2xl text-xs font-bold flex items-center gap-1 border transition shrink-0 ${
                                                    onlyFavorites ? 'bg-amber-100 border-amber-300 text-amber-900' : 'bg-stone-50 border-stone-200 text-stone-600'
                                                }`}
                                            >
                                                <i className={`fa-solid fa-star ${onlyFavorites ? 'text-amber-500' : 'text-stone-300'}`}></i>
                                                お気に入り
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Entry List */}
                                {filteredEntries.length === 0 ? (
                                    <div className="bg-white rounded-3xl p-12 text-center border border-stone-200 space-y-3">
                                        <i className="fa-solid fa-book-open text-4xl text-stone-300"></i>
                                        <p className="text-xs font-bold text-stone-500">日記が見つかりませんでした</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {filteredEntries.map(e => {
                                            const moodObj = MOODS.find(m => m.id === e.mood) || MOODS[1];
                                            const weatherObj = WEATHERS.find(w => w.id === e.weather);

                                            return (
                                                <div key={e.id} className="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-xs space-y-3 relative group">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className="text-xs font-bold text-brand-700">📅 {getJapaneseDateStr(e.date)}</span>
                                                            <span className={`text-[11px] px-2 py-0.5 rounded-full border flex items-center gap-1 ${moodObj.color}`}>
                                                                <span>{moodObj.emoji}</span>
                                                                <span>{moodObj.label}</span>
                                                            </span>
                                                            {weatherObj && (
                                                                <span className="text-[11px] text-stone-500 px-2 py-0.5 bg-stone-100 rounded-full">
                                                                    {weatherObj.icon} {weatherObj.label}
                                                                </span>
                                                            )}
                                                        </div>

                                                        <div className="flex items-center gap-2">
                                                            <button onClick={() => toggleFavorite(e.id)} className="text-stone-300 hover:text-amber-500">
                                                                <i className={`fa-solid fa-star ${e.isFavorite ? 'text-amber-500' : ''}`}></i>
                                                            </button>
                                                            <button onClick={() => openEditEditor(e)} className="text-stone-400 hover:text-stone-600">
                                                                <i className="fa-solid fa-pen"></i>
                                                            </button>
                                                            <button onClick={() => handleDeleteEntry(e.id)} className="text-stone-300 hover:text-rose-500">
                                                                <i className="fa-regular fa-trash-can"></i>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <h3 className="text-sm font-bold font-rounded text-stone-800">{e.title}</h3>
                                                    <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-wrap">{e.content}</p>

                                                    {/* Photo Attachment */}
                                                    {e.image && (
                                                        <div className="pt-1">
                                                            <img src={e.image} alt="添付写真" className="max-h-52 rounded-2xl border border-stone-200 object-cover" />
                                                        </div>
                                                    )}

                                                    {/* Tags */}
                                                    {e.tags && e.tags.length > 0 && (
                                                        <div className="flex flex-wrap gap-1 pt-2">
                                                            {e.tags.map((t, idx) => (
                                                                <span key={idx} className="text-[10px] bg-stone-100 text-stone-600 px-2 py-0.5 rounded-lg font-medium">#{t}</span>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= 2. CALENDAR VIEW ================= */}
                        {currentTab === 'calendar' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in">
                                <div className="md:col-span-2 bg-white rounded-3xl p-6 border border-stone-200 shadow-xs space-y-4">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-base font-bold font-rounded text-stone-800">
                                            {calendarDate.getFullYear()}年 {calendarDate.getMonth() + 1}月
                                        </h2>
                                        <div className="flex gap-1">
                                            <button onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1))} className="p-2 border rounded-xl hover:bg-stone-50"><i className="fa-solid fa-chevron-left text-xs"></i></button>
                                            <button onClick={() => setCalendarDate(new Date())} className="px-3 py-1 text-xs border rounded-xl font-bold">今月</button>
                                            <button onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1))} className="p-2 border rounded-xl hover:bg-stone-50"><i className="fa-solid fa-chevron-right text-xs"></i></button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-7 text-center text-xs font-bold text-stone-400 py-1">
                                        <span className="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                                    </div>

                                    <div className="grid grid-cols-7 gap-1">
                                        {(() => {
                                            const year = calendarDate.getFullYear();
                                            const month = calendarDate.getMonth();
                                            const firstDay = new Date(year, month, 1).getDay();
                                            const totalDays = new Date(year, month + 1, 0).getDate();
                                            const days = [];

                                            for (let i = 0; i < firstDay; i++) {
                                                days.push(<div key={`blank-${i}`} className="h-16 bg-stone-50/50 rounded-2xl"></div>);
                                            }

                                            for (let day = 1; day <= totalDays; day++) {
                                                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                                const hasEntry = entries.some(e => e.date === dateStr);
                                                const isSelected = selectedCalendarDate === dateStr;

                                                days.push(
                                                    <div
                                                        key={dateStr}
                                                        onClick={() => setSelectedCalendarDate(dateStr)}
                                                        className={`h-16 p-1.5 rounded-2xl border cursor-pointer flex flex-col justify-between transition ${
                                                            isSelected ? 'border-brand-500 bg-brand-50/80 ring-2 ring-brand-500/20' : hasEntry ? 'border-amber-300 bg-amber-50/30' : 'border-stone-200 bg-white'
                                                        }`}
                                                    >
                                                        <span className="text-xs font-bold text-stone-700">{day}</span>
                                                        {hasEntry && <span className="text-[10px] text-brand-600 font-bold text-center">●</span>}
                                                    </div>
                                                );
                                            }
                                            return days;
                                        })()}
                                    </div>
                                </div>

                                {/* Calendar Side Preview */}
                                <div className="bg-white rounded-3xl p-6 border border-stone-200 shadow-xs space-y-4">
                                    <div className="flex items-center justify-between border-b pb-3">
                                        <h3 className="text-xs font-bold text-stone-800">{getJapaneseDateStr(selectedCalendarDate)}</h3>
                                        <button onClick={() => openNewEditor(selectedCalendarDate)} className="px-3 py-1 bg-brand-600 text-white rounded-xl text-xs font-bold">
                                            ＋書く
                                        </button>
                                    </div>

                                    {(() => {
                                        const found = entries.find(e => e.date === selectedCalendarDate);
                                        if (!found) return <p className="text-xs text-stone-400 text-center py-8">この日の日記はありません</p>;
                                        const moodObj = MOODS.find(m => m.id === found.mood) || MOODS[1];

                                        return (
                                            <div className="space-y-2">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-xs font-bold">{moodObj.emoji} {moodObj.label}</span>
                                                    <button onClick={() => openEditEditor(found)} className="text-xs text-brand-600"><i className="fa-solid fa-pen"></i></button>
                                                </div>
                                                <h4 className="text-sm font-bold">{found.title}</h4>
                                                <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-wrap">{found.content}</p>
                                                {found.image && <img src={found.image} className="rounded-xl max-h-36 object-cover" />}
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}

                        {/* ================= 3. ANALYTICS VIEW ================= */}
                        {currentTab === 'analytics' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-3xl border border-stone-200 shadow-xs">
                                        <span className="text-xs font-bold text-stone-400">総日記数</span>
                                        <div className="text-2xl font-bold font-rounded text-stone-800 mt-1">{stats.totalCount} <span className="text-xs">件</span></div>
                                    </div>
                                    <div className="bg-white p-5 rounded-3xl border border-stone-200 shadow-xs">
                                        <span className="text-xs font-bold text-stone-400">総文字数</span>
                                        <div className="text-2xl font-bold font-rounded text-stone-800 mt-1">{stats.totalWords.toLocaleString()} <span className="text-xs">文字</span></div>
                                    </div>
                                    <div className="bg-white p-5 rounded-3xl border border-stone-200 shadow-xs col-span-2 sm:col-span-1">
                                        <span className="text-xs font-bold text-stone-400">1記事平均</span>
                                        <div className="text-2xl font-bold font-rounded text-stone-800 mt-1">{stats.avgWords} <span className="text-xs">文字</span></div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-xs space-y-4">
                                    <h3 className="text-sm font-bold font-rounded text-stone-800">😊 気分の割合</h3>
                                    <div className="space-y-3">
                                        {MOODS.map(m => {
                                            const count = stats.moodCounts[m.id] || 0;
                                            const percentage = stats.totalCount > 0 ? Math.round((count / stats.totalCount) * 100) : 0;
                                            return (
                                                <div key={m.id} className="space-y-1">
                                                    <div className="flex justify-between text-xs font-medium">
                                                        <span>{m.emoji} {m.label}</span>
                                                        <span className="text-stone-400">{count}件 ({percentage}%)</span>
                                                    </div>
                                                    <div className="w-full bg-stone-100 h-2 rounded-full overflow-hidden">
                                                        <div className="bg-brand-500 h-full rounded-full transition-all duration-500" style={{ width: `${percentage}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-xs space-y-3">
                                    <h3 className="text-sm font-bold font-rounded text-stone-800">💾 バックアップ</h3>
                                    <button onClick={exportJSON} className="px-4 py-2 bg-stone-800 text-white rounded-xl text-xs font-bold flex items-center gap-2">
                                        <i className="fa-solid fa-download"></i> JSONバックアップをダウンロード
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ================= 4. ZIP IMPORT VIEW ================= */}
                        {currentTab === 'import' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-gradient-to-r from-amber-50 to-orange-50 p-6 rounded-3xl border border-amber-200 shadow-xs space-y-2">
                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-xl shadow-md shrink-0">
                                            <i className="fa-solid fa-file-zipper"></i>
                                        </div>
                                        <div>
                                            <h2 className="text-base font-bold font-rounded text-stone-800">Diaries.zip から一括移行</h2>
                                            <p className="text-xs text-stone-500 mt-0.5">「シンプル日記」等から出力された `Diaries.zip` を選ぶだけで、端末内でフォルダ構造・日付・`home.txt` 本文を全自動で解析して読み込みます。</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white border-2 border-dashed border-stone-300 rounded-3xl p-8 text-center space-y-4 hover:border-amber-400 transition">
                                    <i className="fa-solid fa-cloud-arrow-up text-4xl text-amber-500"></i>
                                    <div>
                                        <h3 className="text-sm font-bold text-stone-800">Diaries.zip ファイルを選択</h3>
                                        <p className="text-xs text-stone-400 mt-1">スマホまたはPC内の ZIPファイルを1つ選ぶだけです</p>
                                    </div>

                                    <label className="cursor-pointer px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl text-xs font-bold shadow-lg shadow-brand-600/20 inline-flex items-center gap-2 transition active:scale-95">
                                        <i className="fa-solid fa-folder-open text-amber-300"></i>
                                        <span>Diaries.zip を選択する</span>
                                        <input type="file" accept=".zip" onChange={(e) => processZipFile(e.target.files[0])} className="hidden" />
                                    </label>
                                </div>

                                {isImporting && (
                                    <div className="bg-white p-6 rounded-3xl border border-stone-200 text-center space-y-2">
                                        <div className="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                        <p className="text-xs font-bold text-amber-700">ZIPファイルを解凍・解析中...</p>
                                    </div>
                                )}

                                {pendingImports.length > 0 && (
                                    <div className="bg-white p-6 rounded-3xl border border-stone-200 space-y-4">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-3">
                                            <h3 className="text-sm font-bold font-rounded">抽出完了: {pendingImports.length}件の日記データ</h3>
                                            <div className="flex items-center gap-2 text-xs">
                                                <span>重複時:</span>
                                                <select value={importConflictMode} onChange={(e) => setImportConflictMode(e.target.value)} className="border rounded-xl px-2 py-1">
                                                    <option value="overwrite">上書きする</option>
                                                    <option value="keepBoth">別記事として両方保存</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                                            {pendingImports.map((item, idx) => (
                                                <div key={idx} className="p-3 bg-stone-50 rounded-2xl border text-xs space-y-1">
                                                    <div className="flex justify-between font-bold text-brand-700">
                                                        <span>📅 {item.date}</span>
                                                        <span className="truncate max-w-[200px]">{item.title}</span>
                                                    </div>
                                                    <p className="text-stone-600 line-clamp-2">{item.content}</p>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex justify-end gap-2 pt-2">
                                            <button onClick={() => setPendingImports([])} className="px-4 py-2 text-xs text-stone-500">キャンセル</button>
                                            <button onClick={executeImport} className="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold shadow-md">
                                                一括インポートを実行する
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* ================= CREATE / EDIT MODAL ================= */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl border border-stone-200 overflow-hidden animate-fade-in max-h-[90vh] flex flex-col">
                                <div className="px-6 py-4 border-b flex items-center justify-between">
                                    <h3 className="text-sm font-bold font-rounded text-stone-800">
                                        {editingId ? '日記を編集' : '日記を書く'}
                                    </h3>
                                    <button onClick={() => setIsModalOpen(false)} className="w-8 h-8 rounded-full hover:bg-stone-100 text-stone-400 flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                                </div>

                                <form onSubmit={handleSaveEntry} className="p-6 space-y-4 overflow-y-auto flex-1">
                                    {/* Date, Mood, Weather Row */}
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-[10px] font-bold text-stone-400 mb-1">日付</label>
                                            <input type="date" value={formDate} onChange={(e) => setFormDate(e.target.value)} required className="w-full px-2 py-1.5 bg-stone-50 border rounded-xl text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-stone-400 mb-1">気分</label>
                                            <select value={formMood} onChange={(e) => setFormMood(e.target.value)} className="w-full px-2 py-1.5 bg-stone-50 border rounded-xl text-xs">
                                                {MOODS.map(m => <option key={m.id} value={m.id}>{m.emoji} {m.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-stone-400 mb-1">天気</label>
                                            <select value={formWeather} onChange={(e) => setFormWeather(e.target.value)} className="w-full px-2 py-1.5 bg-stone-50 border rounded-xl text-xs">
                                                {WEATHERS.map(w => <option key={w.id} value={w.id}>{w.icon} {w.label}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Title */}
                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 mb-1">タイトル</label>
                                        <input type="text" value={formTitle} onChange={(e) => setFormTitle(e.target.value)} placeholder="ひとこと" className="w-full px-3 py-1.5 bg-stone-50 border rounded-xl text-xs" />
                                    </div>

                                    {/* Content */}
                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 mb-1">本文</label>
                                        <textarea value={formContent} onChange={(e) => setFormContent(e.target.value)} rows={6} required placeholder="今日の出来事..." className="w-full px-3 py-2 bg-stone-50 border rounded-xl text-xs leading-relaxed"></textarea>
                                    </div>

                                    {/* Tags */}
                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 mb-1">タグ（カンマ区切り）</label>
                                        <input type="text" value={formTags} onChange={(e) => setFormTags(e.target.value)} placeholder="日常, 読書" className="w-full px-3 py-1.5 bg-stone-50 border rounded-xl text-xs" />
                                    </div>

                                    {/* Image Attachment */}
                                    <div>
                                        <label className="block text-[10px] font-bold text-stone-400 mb-1">写真の添付</label>
                                        {formImage ? (
                                            <div className="relative inline-block mt-1">
                                                <img src={formImage} alt="プレビュー" className="max-h-32 rounded-xl border object-cover" />
                                                <button type="button" onClick={() => setFormImage(null)} className="absolute top-1 right-1 bg-stone-900/80 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">
                                                    <i className="fa-solid fa-xmark"></i>
                                                </button>
                                            </div>
                                        ) : (
                                            <label className="cursor-pointer inline-flex items-center gap-2 px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-xs font-bold transition">
                                                <i className="fa-regular fa-image text-amber-500"></i>
                                                <span>写真を選択する</span>
                                                <input type="file" accept="image/*" onChange={(e) => e.target.files[0] && handleImageUpload(e.target.files[0])} className="hidden" />
                                            </label>
                                        )}
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2 border-t">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-xs text-stone-500">キャンセル</button>
                                        <button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow-md">保存する</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
